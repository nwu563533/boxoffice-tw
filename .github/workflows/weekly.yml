name: 更新票房並部署網站

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 3'   # 每週三 10:00（台灣時間）。官方約週二更新上一週資料
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓官方資料（排程與手動觸發才跑）
        if: github.event_name != 'push'
        run: python scripts/fetch_official.py
      - run: python scripts/build_site_data.py
      - name: 有變動才 commit
        if: github.event_name != 'push'
        run: |
          git config user.name "boxoffice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data.json
          git diff --cached --quiet || git commit -m "每週票房更新 $(date +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
